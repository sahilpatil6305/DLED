# model setting
pretrained:   # path to a pre-trained model, if using one
model_name: dled   # model name
backbone_name: vit  # backbone name

#backbone setting
backbone_config:
  mode: original
  num_classes: 4
  inc: 3
  dropout: false

# dataset
all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV]
train_dataset: [FaceForensics++]
test_dataset: [FaceForensics++, DeepFakeDetection]

compression: c23  # compression-level for videos
train_batchSize: 32   # training batch size
test_batchSize: 100   # test batch size
workers: 8   # number of data loading workers
frame_num: {'train': 32, 'test': 32}   # number of frames to use per video in training and testing
resolution: 224   # resolution of output image to network
with_mask: false   # whether to include mask information in the input
with_landmark: false   # whether to include facial landmark information in the input


# data augmentation
use_data_augmentation: true  # Add this flag to enable/disable data augmentation
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.0
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100

# mean and std for normalization
mean: [0.5, 0.5, 0.5]
std: [0.5, 0.5, 0.5]

# optimizer config
optimizer:
  # choose between 'adam' and 'sgd'
  type: sgd
  adam:
    lr: 0.0002  # learning rate
    beta1: 0.9  # beta1 for Adam optimizer
    beta2: 0.999 # beta2 for Adam optimizer
    eps: 0.00000001  # epsilon for Adam optimizer
    weight_decay: 0.0005  # weight decay for regularization
    amsgrad: false
  sgd:
    lr: 0.0002  # learning rate
    momentum: 0.9  # momentum for SGD optimizer
    weight_decay: 0.0005  # weight decay for regularization

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
# choose between 'adam' and 'sgd'
  NAME: "sgd"
  LR: 0.002
  WEIGHT_DECAY: 0.0005 # weight decay for regularization
  MOMENTUM: 0.9     # momentum for SGD optimizer
  SGD_DAMPNING:
  SGD_NESTEROV:

  RMSPROP_ALPHA:

  ADAM_BETA1: 0.9  # beta1 for Adam optimizer
  ADAM_BETA2: 0.999 # beta2 for Adam optimizer

  STAGED_LR: False
  NEW_LAYERS:
  BASE_LR_MULT:

  MAX_EPOCH: 50
  LR_SCHEDULER: "cosine"
  STEPSIZE:
  GAMMA:
  WARMUP_RECOUNT:
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 0.0002


TRAIN:
  PRINT_FREQ: 5

TRAINER:
  N_CTX : 16   # number of context vectors
  CSC : False  # class-specific context
  CTX_INIT : ""  # initialization words
  PREC : "fp16"  # fp16, fp32, amp
  CLASS_TOKEN_POSITION : "end" # 'middle' or 'end' or 'front'
  ENCODER: 'both'   # 'text' or 'vision' or 'both'
  POSITION: 'all'
  ENABLE_LORA: ['q', 'k', 'v', 'o']
  RANK: 16
  DROPOUT_RATE: 0
  LORA_ALPHA: 1
  BACKUP: 'freq'     # 'freq', 'high' or 'image'

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"
  PROMPT_EDL:
    FIXED_PROMPT: False
  INIT_WEIGHTS: False


# training config
lr_scheduler: null   # learning rate scheduler
nEpochs: 50      # number of epochs to train for
start_epoch: 0   # manual epoch number (useful for restarts)
save_epoch: 1   # interval epochs for saving models
rec_iter: 100   # interval iterations for recording
# logdir: ./logs   # folder to output images and logs
manualSeed: 1024   # manual seed for random number generation

# loss function
loss_func: edl_loss   # loss function to use
evi_func: log         # mse, log, digamma

# metric
metric_scoring: acc   # metric for evaluation (auc, acc, eer, ap)

# cuda

cuda: true   # whether to use CUDA acceleration
cudnn: true   # whether to use CuDNN for convolution operations
