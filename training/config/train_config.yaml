mode: train
# lmdb: True
lmdb: False
dry_run: false
rgb_dir: ''
lmdb_dir:  './datasets/lmdb'

# Folder containing the per-dataset JSON index files. Modify to point at your
# local copy of the DF40 JSON files (see README).
dataset_json_folder: './datasets/DF40/json_file'
SWA: False
save_avg: True
# Output directory for training logs / TensorBoard events.
